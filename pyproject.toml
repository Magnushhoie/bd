[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bd"
version = "0.3.0"
description = "A tiny fzf command launcher for a repository."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Magnus Haraldson Høie", email = "magnus.hhoie@gmail.com" }]
keywords = ["fzf", "cli", "launcher", "commands", "menu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest", "black", "flake8", "isort", "mypy"]

[project.urls]
Homepage = "https://github.com/mhoie/bd"
Source = "https://github.com/mhoie/bd"
Issues = "https://github.com/mhoie/bd/issues"

[project.scripts]
bd = "bd.bd:main"

[tool.black]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["bd"]
include-package-data = true

[tool.setuptools.package-data]
bd = ["template/*"]
